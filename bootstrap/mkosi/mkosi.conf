[Distribution]
Distribution=debian
Release=testing

[Output]
Output=bootstrap
OutputDirectory=mkosi.output

[Content]
Bootable=yes
KernelCommandLine=console=ttyS0
Locale=C.UTF-8
Keymap=us
Timezone=UTC
Hostname=bootstrap-mkosi
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        openssh-server

[Build]
ToolsTree=default
ToolsTreePackages=udev
SandboxTrees=keyring/share/keyrings:/usr/share/keyrings
